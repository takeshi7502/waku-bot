services:
  waku:
    build: .
    image: waku-bot:latest
    container_name: waku-bot
    restart: unless-stopped
    ports:
      - "8180:8180"  # Health check endpoint
    volumes:
      - ./data:/waku/data
      - ./logs:/waku/logs
      - ./settings.toml:/waku/settings.toml
      - ./waku:/waku/waku
    environment:
      - TZ=Asia/Ho_Chi_Minh
    network_mode: host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8180/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Allow time for bot to start and connect
