services:
  waku:
    image: ghcr.io/takeshi7502/waku-bot:v2
    container_name: waku-bot
    restart: unless-stopped
    ports:
      - "8180:8180"  # Health check endpoint
    volumes:
      - ./data:/waku/data
      - ./logs:/waku/logs
      - ./settings.toml:/waku/settings.toml
    environment:
      - TZ=Asia/Ho_Chi_Minh
    network_mode: host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8180/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Allow time for bot to start and connect
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: waku-db
    restart: always
    environment:
      POSTGRES_USER: waku
      POSTGRES_PASSWORD: wakupassword
      POSTGRES_DB: wakudb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waku -d wakudb"]
      interval: 5s
      timeout: 5s
      retries: 5
