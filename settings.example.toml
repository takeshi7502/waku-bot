token = "YOUR_TELEGRAM_BOT_TOKEN"
owners = [123456789]
db_url = "postgresql+asyncpg://waku:wakupassword@localhost:5432/wakudb"
session_name = "waku"
api_id = 123456
api_hash = "YOUR_TELEGRAM_API_HASH"
use_ipv6 = false
log_retention_days = 30
log_level = "INFO" # INFO for release or DEBUG
lang = "vi-VN"
bot_keywords = ["waku"]
health_check_enabled = true

#######################################################################

discord_enabled = false
discord_token = "YOUR_DISCORD_BOT_TOKEN"
discord_keywords = ["waku"]
discord_channel_allowlist = [] # ID server/channel/category/thread được phép; [] = mọi nơi sau khi server bật bằng !waku.
discord_members_intent = true
discord_command_prefix = "!"
discord_admin_users = []
discord_message_history_limit = 20
discord_reply_max_messages = 7
discord_reply_delay_min = 0.7
discord_reply_delay_max = 3.0
discord_agent_max_concurrent = 2 # Giới hạn số lượt AI Discord chạy cùng lúc để tránh quá tải API.
discord_agent_busy_timeout = 20.0 # Chờ tối đa bao nhiêu giây khi Discord AI đang bận trước khi báo quá tải nhẹ.

#######################################################################

redis = false
redis_endpoint = "localhost"
redis_port = 6379
redis_db = 0
redis_password = ""

#######################################################################

agent = true
agent_model = "default/deepseek-v4-flash" # Model chat chính của bot.
agent_model_multimodal = "vision/kr/claude-haiku-4.5" # Model phụ để AI đọc ảnh/sticker nếu model chat chính không hỗ trợ hoặc đọc ảnh kém; bỏ trống thì dùng agent_model.
agent_messages_threshold = 20
agent_whitelist_mode = false
agent_whitelist = []
agent_prompt = '''Bạn là Waku, một người bạn dễ thương, vui tính. BẠN PHẢI LUÔN LUÔN TRẢ LỜI BẰNG TIẾNG VIỆT TRONG MỌI HOÀN CẢNH. Không bao giờ được dùng tiếng Trung.'''

#######################################################################

manyacg_api_url = "https://api.manyacg.top/v1"
manyacg_api_key = ""
manyacg_channel = "MoreACG"
manyacg_bot = "kirakabot"
manyacg_setu_cd = 1
manyacg_hybrid_search = true

# Infographic API https://github.com/krau/infographic-api
# infographic = false
# infographic_api_url = "http://localhost:3000"
# infographic_api_key = ""

#######################################################################

# Sticker memory: học sticker trong group và gửi sticker khớp ngữ nghĩa.
# agent_sticker_embed_model là model embedding thật để tìm sticker theo ý nghĩa.
# Nếu bỏ trống, bot dùng agent_model để tự sinh vector giả lập;
# fallback này chạy được nhưng kém ổn định hơn embedding thật.
# Một số embedding model thường gặp nếu provider hỗ trợ OpenAI-compatible embeddings:
# - openai/text-embedding-3-small
# - openai/text-embedding-3-large
# - nomic/nomic-embed-text hoặc local/nomic-embed-text tùy tên provider của bạn

agent_sticker_memory = true
# agent_sticker_embed_model = "openai/text-embedding-3-small"
agent_sticker_embed_dimensions = 64

# Periodic sticker / reaction: force the model to call the tool every N conversations.
# Set to 0 to disable.
agent_periodic_sticker_interval = 10
agent_periodic_reaction_interval = 5

#######################################################################

# Shell Agent: cho phép owner điều khiển VPS qua chat Telegram.
# Chỉ owner (trong danh sách owners ở trên) mới thấy và dùng được các tool này.
# Mặc định TẮT. Bật lên bằng agent_shell_enabled = true.
# CẢNH BÁO: Tính năng này cho phép chạy lệnh shell trên máy chủ!
# Chỉ bật khi bạn tin tưởng rằng chỉ có bạn là owner duy nhất.

agent_shell_enabled = false
agent_shell_timeout = 30                     # Thời gian tối đa cho mỗi lệnh (giây)
# agent_shell_blocked_commands = ["rm -rf"]  # Lệnh bị chặn thêm (ngoài danh sách mặc định)
# agent_shell_max_output_length = 8000       # Giới hạn ký tự output
# agent_shell_working_dir = "/root"          # Thư mục làm việc mặc định

#######################################################################

# Cấu hình provider đang được source sử dụng. Prefix trước tên model sẽ chọn provider tương ứng.
# Ví dụ: agent_model = "default/deepseek-v4-flash" dùng [agent_providers.default].
#        agent_model_multimodal = "vision/model-name" dùng [agent_providers.vision].
# type = "chat_completions" là kiểu tương thích OpenAI phổ biến; "responses" dùng OpenAI Responses API.

[agent_providers.default]
url = "https://api.deepseek.com"
key = "YOUR_DEEPSEEK_API_KEY"
type = "chat_completions"

[agent_providers.vision]
url = "https://example.com/v1"
key = "YOUR_VISION_API_KEY"
type = "chat_completions"

[agent_providers.openai]
url = "https://api.openai.com/v1"
key = "OPENAI_API_KEY"
type = "chat_completions"
